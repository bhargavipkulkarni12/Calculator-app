<!DOCTYPE html>
<html>
<head>
<style>
body{
  background: linear-gradient(135deg, #667eea, #764ba2);
  font-family: Arial;
  display:flex; justify-content:center; align-items:center;
  height:100vh; margin:0;
}
.card{
  background:white; padding:30px; border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
  width:350px; text-align:center;
}
h2{ color:#764ba2; }
input{
  width:90%; padding:12px; margin:10px 0;
  border-radius:10px; border:2px solid #ddd;
}
.buttons button{
  padding:10px 15px; margin:5px;
  border:none; border-radius:10px;
  color:white; font-weight:bold; cursor:pointer;
}
.add{ background:#4CAF50; }
.sub{ background:#FF9800; }
.mul{ background:#2196F3; }
.div{ background:#E91E63; }
.buttons button:hover{ transform:scale(1.1); }
</style>
</head>
<body>
<div class="card">
<h2>✨ My Colourful Calculator ✨</h2>
<form action="/calculate" method="post">
<input type="number" step="any" name="num1" placeholder="Enter first number" required>
<input type="number" step="any" name="num2" placeholder="Enter second number" required>
<div class="buttons">
<button class="add" name="operation" value="add">Add ➕</button>
<button class="sub" name="operation" value="sub">Sub ➖</button>
<button class="mul" name="operation" value="mul">Mul ✖️</button>
<button class="div" name="operation" value="div">Div ➗</button>
</div>
</form>
</div>
</body>
</html>
