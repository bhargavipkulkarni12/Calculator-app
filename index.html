<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<title>My MathMate - All in One</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;position:fixed;touch-action:manipulation;}
body{background:linear-gradient(135deg,#7c7cff 0%,#a18cd1 50%,#8b5cf6 100%);display:flex;justify-content:center;align-items:center;font-family:Poppins,sans-serif;}
.card{background:#fff;width:92%;max-width:380px;max-height:95vh;overflow-y:auto;padding:16px 14px;border-radius:20px;box-shadow:0 15px 40px rgba(0,0,0,0.25);transition:transform 0.38s;box-sizing:border-box;}
.card.up{transform:translateY(-100px);}
h2{text-align:center;margin:0 0 10px 0;color:#5a189a;font-size:20px}
.input-wrap{width:100%;box-sizing:border-box;padding:2px;}
input{width:100%;box-sizing:border-box!important;padding:11px 10px;border-radius:10px;border:2px solid #d1d5db;margin:0 0 8px 0;font-size:15px!important;font-weight:600;outline:none;background:#f9f9ff;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
input.active{border:2.5px solid #000!important;box-shadow:none!important;padding:10.5px 9.5px;}
.tabs{display:flex;gap:6px;margin:8px 0;}
.tabs button{flex:1;border:none;padding:8px;border-radius:9px;font-weight:800;font-size:12px;background:#e5e7eb;color:#111}
.tabs button.active-tab{background:#000;color:#fff;}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 6px 0}
.btns button{border:none;padding:10px 4px;border-radius:10px;font-weight:800;font-size:12.5px;color:#fff;cursor:pointer;}
.add{background:#22c55e}.sub{background:#f59e0b}.mul{background:#3b82f6}.div{background:#ec4899}
.pow{background:#8b5cf6}.sqrt{background:#06b6d4}.mod{background:#6366f1}.per{background:#f43f5e}
.trig{background:#0ea5e9}.log{background:#8b5cf6}.sci{background:#14b8a6}
.black{background:#111}
#result{text-align:center;font-weight:800;margin-top:8px;font-size:16px;color:#5a189a;word-break:break-all;min-height:20px;background:#f5f3ff;padding:8px;border-radius:10px;}
.cute-kb{position:fixed;bottom:0;left:0;right:0;background:#f5f5f5;border-radius:24px 24px 0 0;padding:12px 10px 16px 10px;box-shadow:0 -10px 30px rgba(0,0,0,0.18);display:grid;grid-template-columns:repeat(3,1fr);gap:9px;transform:translateY(105%);transition:0.38s;z-index:998;}
.cute-kb.show{transform:translateY(0);}
.cute-kb button{height:50px;border:none;border-radius:14px;font-size:20px;font-weight:800}
.k-n{background:#e5e7eb;color:#111;border:1px solid #d1d5db;}.k-d{background:#9ca3af;color:#fff;}.k-c{background:#d1d5db;color:#111;}
.k-ok{background:#111;color:#fff;grid-column:span 3;height:44px;font-size:15px}
.small-opt{display:flex;gap:6px;justify-content:center;margin:4px 0}
.small-opt button{padding:4px 8px;border-radius:6px;border:1px solid #ddd;background:#fff;font-size:11px;font-weight:700}
.small-opt button.on{background:#000;color:#fff}
/* POPUP */
#installBanner{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-200px);width:90%;max-width:350px;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 12px 35px rgba(0,0,0,0.35);display:flex;align-items:center;gap:10px;z-index:999999;transition:transform 0.6s cubic-bezier(0.68,-0.55,0.27,1.55);box-sizing:border-box;border:2px solid #5a189a;}
#installBanner.show{transform:translateX(-50%) translateY(0)!important;}
</style>
</head>
<body>

<div id="installBanner">
  <div style="width:42px;height:42px;background:linear-gradient(135deg,#a18cd1,#ff70a6);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px">M</div>
  <div style="flex:1"><b style="font-size:13px;display:block;color:#000">My MathMate</b><span style="font-size:11px;color:#666">Install on your phone?</span></div>
  <button style="border:none;padding:8px 12px;border-radius:10px;background:#5a189a;color:#fff;font-weight:bold;font-size:12px" onclick="installApp()">Install</button>
  <button style="border:none;padding:8px 10px;border-radius:10px;background:#eee;font-weight:bold" onclick="hideBanner()">✕</button>
</div>

<div class="card" id="card">
  <h2>✨ My MathMate ✨</h2>
  <div class="input-wrap"><input type="text" id="n1" readonly placeholder="Enter number (main)" onclick="openKB('n1')"></div>
  <div class="input-wrap"><input type="text" id="n2" readonly placeholder="Second number (for + - × ÷ ^)" onclick="openKB('n2')"></div>
  <div class="small-opt">
    <button id="degBtn" class="on" onclick="setMode('deg')">DEG</button>
    <button id="radBtn" onclick="setMode('rad')">RAD</button>
    <button onclick="clearAll()">Clear C</button>
  </div>
  <div class="tabs">
    <button id="tabBasic" class="active-tab" onclick="showTab('basic')">Basic</button>
    <button id="tabSci" onclick="showTab('sci')">Trigno & All</button>
  </div>
  <div id="basicPanel" class="btns">
    <button class="add" onclick="doCalc('+')">+ Add</button>
    <button class="sub" onclick="doCalc('-')">- Sub</button>
    <button class="mul" onclick="doCalc('*')">× Mul</button>
    <button class="div" onclick="doCalc('/')">÷ Div</button>
    <button class="per" onclick="doCalc('per')">% of</button>
    <button class="mod" onclick="doCalc('%')">Mod</button>
    <button class="pow" onclick="doCalc('^')">xʸ</button>
    <button class="black" onclick="doCalc('root')">y√x</button>
  </div>
  <div id="sciPanel" class="btns" style="display:none">
    <button class="trig" onclick="doTrig('sin')">sin</button>
    <button class="trig" onclick="doTrig('cos')">cos</button>
    <button class="trig" onclick="doTrig('tan')">tan</button>
    <button class="trig" style="background:#0284c7" onclick="doTrig('asin')">sin⁻¹</button>
    <button class="trig" style="background:#0284c7" onclick="doTrig('acos')">cos⁻¹</button>
    <button class="trig" style="background:#0284c7" onclick="doTrig('atan')">tan⁻¹</button>
    <button class="sqrt" onclick="doSingle('sqrt')">√</button>
    <button class="sqrt" onclick="doSingle('cbrt')">∛</button>
    <button class="sci" onclick="doSingle('sq')">x²</button>
    <button class="sci" onclick="doSingle('cube')">x³</button>
    <button class="sci" onclick="doSingle('inv')">1/x</button>
    <button class="sci" onclick="doSingle('fact')">x!</button>
    <button class="log" onclick="doSingle('log')">log10</button>
    <button class="log" onclick="doSingle('ln')">ln</button>
    <button class="log" onclick="doSingle('exp')">eˣ</button>
    <button class="log" onclick="doSingle('tenpow')">10ˣ</button>
  </div>
  <div id="result">Result will show here</div>
</div>

<div class="cute-kb" id="kb">
  <button class="k-n" onclick="tap('1')">1</button><button class="k-n" onclick="tap('2')">2</button><button class="k-n" onclick="tap('3')">3</button>
  <button class="k-n" onclick="tap('4')">4</button><button class="k-n" onclick="tap('5')">5</button><button class="k-n" onclick="tap('6')">6</button>
  <button class="k-n" onclick="tap('7')">7</button><button class="k-n" onclick="tap('8')">8</button><button class="k-n" onclick="tap('9')">9</button>
  <button class="k-d" onclick="tap('.')">.</button><button class="k-n" onclick="tap('0')">0</button><button class="k-c" onclick="del()">⌫</button>
  <button class="k-ok" onclick="closeKB()">Done ✓</button>
</div>

<script>
let active='n1', kb=document.getElementById('kb'), card=document.getElementById('card'), mode='deg';
function openKB(id){active=id; kb.classList.add('show'); card.classList.add('up'); document.getElementById('n1').classList.toggle('active',id=='n1'); document.getElementById('n2').classList.toggle('active',id=='n2');}
function closeKB(){kb.classList.remove('show'); card.classList.remove('up'); document.getElementById('n1').classList.remove('active'); document.getElementById('n2').classList.remove('active');}
function tap(v){document.getElementById(active).value+=v;}
function del(){document.getElementById(active).value=document.getElementById(active).value.slice(0,-1);}
function clearAll(){document.getElementById('n1').value=''; document.getElementById('n2').value=''; document.getElementById('result').innerText='Result will show here';}
function setMode(m){mode=m; document.getElementById('degBtn').classList.toggle('on',m=='deg'); document.getElementById('radBtn').classList.toggle('on',m=='rad');}
function showTab(t){
  document.getElementById('basicPanel').style.display = t=='basic'?'grid':'none';
  document.getElementById('sciPanel').style.display = t=='sci'?'grid':'none';
  document.getElementById('tabBasic').classList.toggle('active-tab',t=='basic');
  document.getElementById('tabSci').classList.toggle('active-tab',t=='sci');
}
function doCalc(op){
 let a=parseFloat(document.getElementById('n1').value), b=parseFloat(document.getElementById('n2').value), rD=document.getElementById('result');
 if(isNaN(a)){rD.innerText='Enter first number!';return;}
 if(['+','-','*','/','^','%','per','root'].includes(op) && isNaN(b)){rD.innerText='Enter second number!';return;}
 let r=0;
 if(op=='+') r=a+b; if(op=='-') r=a-b; if(op=='*') r=a*b; if(op=='/') r=b!=0?a/b:'No /0!';
 if(op=='^') r=Math.pow(a,b); if(op=='%') r=a%b;
 if(op=='per') r=(a/100)*b;
 if(op=='root') r=Math.pow(a,1/b);
 rD.innerText='Result: '+r; closeKB();
}
function toRad(x){return mode=='deg'? x*Math.PI/180 : x;}
function toDeg(x){return mode=='deg'? x*180/Math.PI : x;}
function doTrig(fn){
 let a=parseFloat(document.getElementById('n1').value), rD=document.getElementById('result');
 if(isNaN(a)){rD.innerText='Enter number!';return;} let r=0;
 if(fn=='sin') r=Math.sin(toRad(a)); if(fn=='cos') r=Math.cos(toRad(a)); if(fn=='tan') r=Math.tan(toRad(a));
 if(fn=='asin') r=toDeg(Math.asin(a)); if(fn=='acos') r=toDeg(Math.acos(a)); if(fn=='atan') r=toDeg(Math.atan(a));
 rD.innerText='Result: '+Number(r.toFixed(6)); closeKB();
}
function doSingle(type){
 let a=parseFloat(document.getElementById('n1').value), rD=document.getElementById('result');
 if(isNaN(a)){rD.innerText='Enter number!';return;} let r=0;
 if(type=='sqrt') r=a>=0?Math.sqrt(a):'Invalid';
 if(type=='cbrt') r=Math.cbrt(a);
 if(type=='sq') r=a*a; if(type=='cube') r=a*a*a;
 if(type=='inv') r=a!=0?1/a:'No /0'; if(type=='fact'){r=1; for(let i=2;i<=a;i++) r*=i;}
 if(type=='log') r=a>0?Math.log10(a):'Invalid'; if(type=='ln') r=a>0?Math.log(a):'Invalid';
 if(type=='exp') r=Math.exp(a); if(type=='tenpow') r=Math.pow(10,a);
 rD.innerText='Result: '+ (typeof r=='number'?Number(r.toFixed(6)):r); closeKB();
}

// --- POPUP INSTALL LOGIC ---
let deferredPrompt;
const banner = document.getElementById('installBanner');
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
});
function showBanner(){ banner.classList.add('show'); }
function hideBanner(){ banner.classList.remove('show'); }
function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(()=>{ deferredPrompt=null; hideBanner(); });
  }else{
    alert('To install:\n1. Tap 3 dots ⋮ (top right)\n2. Tap Install app / Add to Home Screen');
    hideBanner();
  }
}
setTimeout(showBanner, 1200);
if('serviceWorker' in navigator){
  const sw = `self.addEventListener('install', e=>self.skipWaiting()); self.addEventListener('fetch', e=>e.respondWith(fetch(e.request).catch(()=>{})));`;
  const blob = new Blob([sw], {type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
</body>
</html>
