<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My MathMate</title>
<style>
body{margin:0;background:linear-gradient(135deg,#7c7cff,#a18cd1 50%,#8b5cf6);display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Poppins,sans-serif;}
.card{background:#fff;width:94%;max-width:390px;padding:14px;border-radius:20px;box-shadow:0 15px 40px rgba(0,0,0,0.25);}
h2{text-align:center;margin:0 0 8px;color:#5a189a}
.display-wrap{background:#f9f5ff;border:2px solid #000;border-radius:14px;padding:8px 10px;margin-bottom:8px;}
#display{width:100%;border:none;background:transparent;font-size:22px;font-weight:800;outline:none;text-align:right;}
#mini{font-size:12px;color:#666;text-align:right;min-height:14px;word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
.keys button{border:none;padding:13px 4px;border-radius:11px;font-weight:800;font-size:14px}
.n{background:#e5e7eb}
.op{background:#3b82f6;color:#fff}
.eq{background:#22c55e;color:#fff;grid-column:span 2}
.clr{background:#111;color:#fff}
.fn{background:#06b6d4;color:#fff;font-size:12px}
.tr{background:#0ea5e9;color:#fff;font-size:11px}
#result{text-align:center;font-weight:800;margin-top:6px;background:#f5f3ff;padding:7px;border-radius:10px;color:#5a189a}
.tabs{display:flex;gap:6px;margin:6px 0}
.tabs button{flex:1;border:none;padding:7px;border-radius:8px;font-weight:800;font-size:11px;background:#e5e7eb}
.tabs button.active-tab{background:#000;color:#fff}

/* GUARANTEED POPUP - ALWAYS VISIBLE */
#pop{
 position:fixed;
 top:-200px;
 left:50%;
 transform:translateX(-50%);
 width:92%;
 max-width:360px;
 background:#fff;
 border:3px solid #5a189a;
 border-radius:18px;
 padding:14px;
 display:flex;
 align-items:center;
 gap:10px;
 z-index:9999999;
 transition: top 0.5s ease;
 box-shadow:0 10px 30px rgba(0,0,0,0.4);
}
#pop.show{ top:15px; }
</style>
</head>
<body>

<!-- THIS WILL 100% SHOW -->
<div id="pop">
  <div style="width:45px;height:45px;background:linear-gradient(135deg,#a18cd1,#ff70a6);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:22px">M</div>
  <div style="flex:1">
    <b style="font-size:14px;color:#000">My MathMate</b><br>
    <span style="font-size:11px;color:#555">Install this app?</span>
  </div>
  <button onclick="doInstall()" style="background:#5a189a;color:#fff;border:none;padding:8px 14px;border-radius:10px;font-weight:800">Install</button>
  <button onclick="document.getElementById('pop').classList.remove('show')" style="background:#eee;border:none;padding:8px 10px;border-radius:10px">✕</button>
</div>

<div class="card">
  <h2>✨ My MathMate ✨</h2>
  <div class="display-wrap">
    <input type="text" id="display" placeholder="Type like 12+5*3-8/2" readonly>
    <div id="mini"></div>
  </div>
  <div style="display:flex;gap:6px;justify-content:center;margin:4px 0">
    <button id="degBtn" onclick="setMode('deg')" style="padding:4px 8px;border-radius:6px;border:1px solid #ddd;background:#000;color:#fff;font-size:11px;font-weight:700">DEG</button>
    <button id="radBtn" onclick="setMode('rad')" style="padding:4px 8px;border-radius:6px;border:1px solid #ddd;background:#fff;font-size:11px;font-weight:700">RAD</button>
  </div>
  <div class="tabs">
    <button id="tabB" class="active-tab" onclick="showTab('b')">Basic</button>
    <button id="tabS" onclick="showTab('s')">Scientific</button>
  </div>
  <div id="basicKeys" class="keys">
    <button class="clr" onclick="clearD()">C</button>
    <button class="n" onclick="back()">⌫</button>
    <button class="op" onclick="add('(')">(</button>
    <button class="op" onclick="add(')')">)</button>
    <button class="n" onclick="add('7')">7</button>
    <button class="n" onclick="add('8')">8</button>
    <button class="n" onclick="add('9')">9</button>
    <button class="op" onclick="add('/')">÷</button>
    <button class="n" onclick="add('4')">4</button>
    <button class="n" onclick="add('5')">5</button>
    <button class="n" onclick="add('6')">6</button>
    <button class="op" onclick="add('*')">×</button>
    <button class="n" onclick="add('1')">1</button>
    <button class="n" onclick="add('2')">2</button>
    <button class="n" onclick="add('3')">3</button>
    <button class="op" onclick="add('-')">-</button>
    <button class="n" onclick="add('0')">0</button>
    <button class="n" onclick="add('.')">.</button>
    <button class="op" onclick="add('%')">%</button>
    <button class="op" onclick="add('+')">+</button>
    <button class="eq" onclick="solve()">= Calculate</button>
    <button class="op" onclick="add('**')" style="background:#8b5cf6">xʸ</button>
    <button class="fn" onclick="add('√(')">√</button>
  </div>
  <div id="sciKeys" class="keys" style="display:none">
    <button class="tr" onclick="add('sin(')">sin</button>
    <button class="tr" onclick="add('cos(')">cos</button>
    <button class="tr" onclick="add('tan(')">tan</button>
    <button class="tr" onclick="add('log(')">log</button>
    <button class="fn" onclick="add('ln(')">ln</button>
    <button class="fn" onclick="add('√(')">√</button>
    <button class="fn" onclick="add('^2')">x²</button>
    <button class="fn" onclick="add('^3')">x³</button>
    <button class="fn" onclick="add('!')">x!</button>
    <button class="fn" onclick="add('1/(')">1/x</button>
    <button class="fn" onclick="add('π')">π</button>
    <button class="fn" onclick="add('e')">e</button>
    <button class="n" onclick="add('7')">7</button>
    <button class="n" onclick="add('8')">8</button>
    <button class="n" onclick="add('9')">9</button>
    <button class="op" onclick="add('+')">+</button>
    <button class="n" onclick="add('4')">4</button>
    <button class="n" onclick="add('5')">5</button>
    <button class="n" onclick="add('6')">6</button>
    <button class="op" onclick="add('-')">-</button>
    <button class="n" onclick="add('1')">1</button>
    <button class="n" onclick="add('2')">2</button>
    <button class="n" onclick="add('3')">3</button>
    <button class="op" onclick="add('*')">×</button>
    <button class="n" onclick="add('0')">0</button>
    <button class="n" onclick="add('.')">.</button>
    <button class="op" onclick="add('/')">÷</button>
    <button class="eq" onclick="solve()">=</button>
    <button class="clr" style="grid-column:span 2" onclick="clearD()">Clear</button>
    <button class="n" style="grid-column:span 2" onclick="back()">Delete ⌫</button>
  </div>
  <div id="result">Result: 0</div>
</div>

<script>
let mode='deg', display=document.getElementById('display'), mini=document.getElementById('mini');
function setMode(m){mode=m; degBtn.style.background=m=='deg'?'#000':'#fff'; degBtn.style.color=m=='deg'?'#fff':'#000'; radBtn.style.background=m=='rad'?'#000':'#fff'; radBtn.style.color=m=='rad'?'#fff':'#000';}
function showTab(t){basicKeys.style.display=t=='b'?'grid':'none'; sciKeys.style.display=t=='s'?'grid':'none'; tabB.classList.toggle('active-tab',t=='b'); tabS.classList.toggle('active-tab',t=='s');}
function add(v){ if(v=='π') v='3.1415926535'; if(v=='e') v='2.7182818284'; if(v=='^2') v='**2'; if(v=='^3') v='**3'; display.value+=v; }
function clearD(){display.value=''; result.innerText='Result: 0'; mini.innerText='';}
function back(){display.value=display.value.slice(0,-1);}
function fact(n){if(n<0) return NaN; if(n==0) return 1; let r=1; for(let i=2;i<=n;i++) r*=i; return r;}
function solve(){
  let expr=display.value.trim();
  if(!expr){result.innerText='Type something di!';return;}
  try{
    let jsExpr=expr.replace(/√\(/g,'Math.sqrt(').replace(/\^/g,'**').replace(/(\d+)!/g,'fact($1)').replace(/1\/\(/g,'(1/(');
    const sin = (x)=> Math.sin(mode=='deg'? x*Math.PI/180 : x);
    const cos = (x)=> Math.cos(mode=='deg'? x*Math.PI/180 : x);
    const tan = (x)=> Math.tan(mode=='deg'? x*Math.PI/180 : x);
    const log = (x)=> Math.log10(x);
    const ln = (x)=> Math.log(x);
    let r = Function('sin','cos','tan','log','ln','Math','fact','sqrt', 'return '+jsExpr)(sin,cos,tan,log,ln,Math,fact,Math.sqrt);
    mini.innerText=expr+' ='; display.value=r; result.innerText='Result: '+ Number(Number(r).toFixed(8));
  }catch(e){ result.innerText='Invalid! Check brackets di'; }
}

// POPUP - WILL SHOW 100%
let promptEvent;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); promptEvent=e; });

// FORCE SHOW AFTER 1 SEC
setTimeout(()=>{ document.getElementById('pop').classList.add('show'); }, 1000);

function doInstall(){
  if(promptEvent){
    promptEvent.prompt();
  }else{
    alert('To Install App:\n\n1. Tap 3 dots ⋮ top right\n2. Tap "Add to Home Screen" or "Install app"\n\nApp will be installed like real app!');
    document.getElementById('pop').classList.remove('show');
  }
}
</script>
</body>
</html>
