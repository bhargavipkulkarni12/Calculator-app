<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<title>My MathMate</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;position:fixed;touch-action:manipulation;}
body{background:linear-gradient(135deg,#7c7cff 0%,#a18cd1 50%,#8b5cf6 100%);display:flex;justify-content:center;align-items:center;font-family:Poppins,sans-serif;}

/* CARD WITH EXTRA INNER SPACE */
.card{
  background:#fff;width:84%;max-width:320px;
  padding:22px 18px;border-radius:22px;
  box-shadow:0 15px 40px rgba(0,0,0,0.25);
  transition:transform 0.38s;box-sizing:border-box;
  overflow:visible; /* so shadow not cut weirdly */
}
.card.up{transform:translateY(-130px);}
h2{text-align:center;margin:0 0 14px 0;color:#5a189a;font-size:20px}

/* INPUT NEVER GOES OUT - 100% INSIDE */
.input-wrap{width:100%;box-sizing:border-box;padding:2px;} /* extra 2px buffer */
input{
  width:100%;max-width:100%;box-sizing:border-box!important;
  padding:12px 10px;border-radius:12px;border:2px solid #d1d5db;
  margin:0 0 11px 0;font-size:16px!important;font-weight:600;
  outline:none;background:#f9f9ff;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
/* BLACK BORDER - INSIDE ONLY, NO GLOW OUTSIDE */
input.active{
  border:2.5px solid #000!important;
  background:#fff!important;
  box-shadow:none!important; /* REMOVED GLOW THAT GOES OUT */
  padding:11.5px 9.5px; /* adjust for thicker border so size same */
}

.btns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px 0 4px 0}
.btns button{border:none;padding:10px 13px;border-radius:11px;font-weight:bold;font-size:13px;color:#fff}
.add{background:#22c55e}.sub{background:#f59e0b}.mul{background:#3b82f6}.div{background:#ec4899}
#result{text-align:center;font-weight:800;margin-top:10px;font-size:18px;color:#5a189a;word-break:break-all;}

#installBanner{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-150px);width:88%;max-width:330px;background:#fff;border-radius:16px;padding:11px 12px;box-shadow:0 10px 30px rgba(0,0,0,0.3);display:flex;align-items:center;gap:8px;z-index:9999;transition:0.5s;box-sizing:border-box;}
#installBanner.show{transform:translateX(-50%) translateY(0);}
.logo{width:38px;min-width:38px;height:38px;background:linear-gradient(135deg,#a18cd1,#ff70a6);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.txt{flex:1;overflow:hidden}.txt b{font-size:13px}.txt span{font-size:11px;color:#666}
#installBanner button{border:none;padding:7px 10px;border-radius:9px;font-weight:bold;flex-shrink:0}
.btn-install{background:#5a189a;color:#fff}.btn-close{background:#eee}

.cute-kb{position:fixed;bottom:0;left:0;right:0;background:#f5f5f5;border-radius:24px 24px 0 0;padding:12px 10px 16px 10px;box-shadow:0 -10px 30px rgba(0,0,0,0.18);display:grid;grid-template-columns:repeat(3,1fr);gap:9px;transform:translateY(105%);transition:0.38s;z-index:998;box-sizing:border-box;}
.cute-kb.show{transform:translateY(0);}
.cute-kb button{height:52px;border:none;border-radius:15px;font-size:22px;font-weight:800}
.k-n{background:#e5e7eb;color:#111;border:1px solid #d1d5db;}.k-d{background:#9ca3af;color:#fff;}.k-c{background:#d1d5db;color:#111;}
.k-ok{background:#111;color:#fff;grid-column:span 3;height:46px;font-size:16px}
</style>
</head>
<body>
<div id="installBanner"><div class="logo">M</div><div class="txt"><b>My MathMate</b><span>Install app now!</span></div><button class="btn-install" onclick="installApp()">Install</button><button class="btn-close" onclick="hideBanner()">✕</button></div>
<div class="card" id="card">
  <h2>✨ My MathMate ✨</h2>
  <div class="input-wrap"><input type="text" id="n1" readonly placeholder="Enter first number" onclick="openKB('n1')"></div>
  <div class="input-wrap"><input type="text" id="n2" readonly placeholder="Enter second number" onclick="openKB('n2')"></div>
  <div class="btns"><button class="add" onclick="doCalc('+')">Add +</button><button class="sub" onclick="doCalc('-')">Sub -</button><button class="mul" onclick="doCalc('*')">Mul ×</button><button class="div" onclick="doCalc('/')">Div ÷</button></div>
  <div id="result"></div>
</div>
<div class="cute-kb" id="kb">
  <button class="k-n" onclick="tap('1')">1</button><button class="k-n" onclick="tap('2')">2</button><button class="k-n" onclick="tap('3')">3</button>
  <button class="k-n" onclick="tap('4')">4</button><button class="k-n" onclick="tap('5')">5</button><button class="k-n" onclick="tap('6')">6</button>
  <button class="k-n" onclick="tap('7')">7</button><button class="k-n" onclick="tap('8')">8</button><button class="k-n" onclick="tap('9')">9</button>
  <button class="k-d" onclick="tap('.')">.</button><button class="k-n" onclick="tap('0')">0</button><button class="k-c" onclick="del()">⌫</button>
  <button class="k-ok" onclick="closeKB()">Done ✓</button>
</div>
<script>
let active='n1', kb=document.getElementById('kb'), card=document.getElementById('card');
function openKB(id){active=id; kb.classList.add('show'); card.classList.add('up'); document.getElementById('n1').classList.toggle('active',id=='n1'); document.getElementById('n2').classList.toggle('active',id=='n2');}
function closeKB(){kb.classList.remove('show'); card.classList.remove('up'); document.getElementById('n1').classList.remove('active'); document.getElementById('n2').classList.remove('active');}
function tap(v){document.getElementById(active).value+=v;}
function del(){document.getElementById(active).value=document.getElementById(active).value.slice(0,-1);}
function doCalc(op){let a=parseFloat(document.getElementById('n1').value), b=parseFloat(document.getElementById('n2').value), rD=document.getElementById('result'); if(isNaN(a)||isNaN(b)){rD.innerText='Enter both di!';return;} let r=0; if(op=='+') r=a+b; if(op=='-') r=a-b; if(op=='*') r=a*b; if(op=='/') r=b!=0?a/b:'No /0'; rD.innerText='Result: '+r; closeKB();}
let deferredPrompt; const banner=document.getElementById('installBanner');
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt=e; setTimeout(()=>banner.classList.add('show'),1500); });
function installApp(){ if(deferredPrompt){deferredPrompt.prompt(); deferredPrompt.userChoice.then(()=>{deferredPrompt=null; hideBanner();});} else alert('3 dots > Install app');}
function hideBanner(){banner.classList.remove('show');}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
